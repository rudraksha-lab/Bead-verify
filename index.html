<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validation Result</title>

<style>

    body{
        font-family: Arial, sans-serif;
        margin:0;
        padding:0;
        background:white;
        text-align:center;
    }

    .header{
        background:#4CAF50;
        color:white;
        padding:20px;
    }

    .header h1{
        margin:0;
        font-size:2.5em;
    }

    .header p{
        margin-top:5px;
        font-size:1.1em;
    }

    .found{
        font-size:2em;
        margin:20px 0;
        font-weight:bold;
    }

    .bead-image{
        max-width:220px;
        margin:20px auto;
        display:block;
    }

    .authentic{
        max-width:300px;
        margin:20px auto;
        display:block;
    }

    .details{
        max-width:450px;
        margin:auto;
        text-align:left;
        padding:20px;
        font-size:1.05em;
    }

    .details p{
        margin:12px 0;
    }

    .logos{
        display:flex;
        justify-content:center;
        gap:25px;
        margin:30px 0;
        flex-wrap:wrap;
    }

    .logo{
        max-width:80px;
        max-height:80px;
        object-fit:contain;
    }

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">
    <h1 id="title">Validation Result</h1>
    <p id="labName">Rudraksh Gems Testing Lab.</p>
</div>

<div class="found" id="status">Found</div>

<!-- DYNAMIC BEAD IMAGE -->

<img id="beadImage" class="bead-image" src="" alt="Bead Image">

<!-- AUTHENTIC IMAGE -->

<img src="Authentic.jpg" class="authentic" alt="Authentic Stamp">

<!-- DETAILS -->

<div class="details">

    <p><strong>Certificate No</strong> - <span id="cert"></span></p>

    <p><strong>Item Name</strong> - <span id="itemName"></span></p>

    <p><strong>Weight</strong> - <span id="weight"></span></p>

    <p><strong>Shape and Cut</strong> - <span id="shape"></span></p>

    <p><strong>Color</strong> - <span id="color"></span></p>

    <p><strong>Measurement</strong> - <span id="measurement"></span></p>

    <p><strong>Mount</strong> - <span id="mount"></span></p>

    <p><strong>Natural Faces</strong> - <span id="faces"></span></p>

    <p><strong>Xrays</strong> - <span id="xrays"></span></p>

    <p><strong>Created Faces</strong> - <span id="createdFaces"></span></p>

    <p><strong>Test</strong> - <span id="test"></span></p>

    <p><strong>Comments</strong> - <span id="comments"></span></p>

</div>

<!-- LOGOS -->

<div class="logos">
    <img src="Iso.jpg" class="logo" alt="ISO">
    <img src="Iaf.png" class="logo" alt="IAF">
    <img src="Ias.jpg" class="logo" alt="IAS">
</div>

<script>

/* =========================================
   GET URL PARAMETERS
========================================= */

const params = new URLSearchParams(window.location.search);

/* =========================================
   HELPER FUNCTION
========================================= */

function getValue(param, fallback = "Not Provided") {

    const value = params.get(param);

    if(value && value.trim() !== ""){
        return decodeURIComponent(value);
    }

    return fallback;
}

/* =========================================
   DYNAMIC FACES
========================================= */

const faces = getValue("faces", "1");

/* =========================================
   SET TEXT VALUES
========================================= */

document.getElementById("title").textContent =
    getValue("title", "Validation Result");

document.getElementById("labName").textContent =
    getValue("lab", "Rudraksh Gems Testing Lab.");

document.getElementById("status").textContent =
    getValue("status", "Found");

document.getElementById("cert").textContent =
    getValue("cert");

document.getElementById("itemName").textContent =
    getValue(
        "itemName",
        `Natural ${faces} Face Rudraksha`
    );

document.getElementById("weight").textContent =
    getValue("weight");

document.getElementById("shape").textContent =
    getValue("shape", "Round");

document.getElementById("color").textContent =
    getValue("color", "Brown");

document.getElementById("measurement").textContent =
    getValue("measurement");

document.getElementById("mount").textContent =
    getValue("mount", "Mounted");

document.getElementById("faces").textContent =
    faces;

document.getElementById("xrays").textContent =
    getValue(
        "xrays",
        "Internally same structure"
    );

document.getElementById("createdFaces").textContent =
    getValue("createdFaces", "None");

document.getElementById("test").textContent =
    getValue(
        "test",
        "Microscopic observation"
    );

document.getElementById("comments").textContent =
    getValue(
        "comments",
        `${faces} faces seen in microscope`
    );

/* =========================================
   DYNAMIC IMAGE
========================================= */

const beadImage = getValue("img", "");

if(beadImage !== ""){

    const img = document.getElementById("beadImage");

    img.src = beadImage;

}else{

    document.getElementById("beadImage").style.display = "none";

}

</script>

</body>
</html>
