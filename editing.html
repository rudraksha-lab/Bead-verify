<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rudraksha Photo Editor</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #eeeeee;
        text-align: center;
    }

    h2 {
        margin-bottom: 15px;
    }

    .controls {
        background: white;
        max-width: 600px;
        margin: auto;
        padding: 20px;
        border-radius: 12px;
    }

    input,
    button {
        font-size: 16px;
        padding: 10px 14px;
        margin: 6px;
    }

    button {
        cursor: pointer;
    }

    canvas {
        display: block;
        width: min(90vw, 600px);
        height: auto;
        margin: 25px auto;
        background: white;
        border: 1px solid #ccc;
    }

    #status {
        margin-top: 10px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h2>Rudraksha Photo Editor</h2>

<div class="controls">

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <br>

    <button id="processButton">
        Process Bead
    </button>

    <button id="downloadButton">
        Download
    </button>

    <p id="status">Choose a photo.</p>

</div>

<canvas
    id="output"
    width="1000"
    height="1000">
</canvas>


<script>

const input = document.getElementById("imageInput");
const processButton = document.getElementById("processButton");
const downloadButton = document.getElementById("downloadButton");
const statusText = document.getElementById("status");

const output = document.getElementById("output");
const outCtx = output.getContext("2d");

let sourceImage = null;


/* --------------------------------------------------
   LOAD IMAGE
-------------------------------------------------- */

input.addEventListener("change", function () {

    const file = input.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        const img = new Image();

        img.onload = function () {

            sourceImage = img;

            statusText.textContent =
                "Photo loaded. Click Process Bead.";

            // Show original temporarily
            outCtx.fillStyle = "white";
            outCtx.fillRect(0, 0, 1000, 1000);

            const scale = Math.min(
                900 / img.width,
                900 / img.height
            );

            const w = img.width * scale;
            const h = img.height * scale;

            outCtx.drawImage(
                img,
                (1000 - w) / 2,
                (1000 - h) / 2,
                w,
                h
            );
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
});


/* --------------------------------------------------
   PROCESS
-------------------------------------------------- */

processButton.addEventListener("click", function () {

    if (!sourceImage) {
        alert("Please choose an image first.");
        return;
    }

    statusText.textContent = "Processing...";

    // Let browser update status before heavy processing
    setTimeout(processImage, 50);
});


function processImage() {

    /*
       Work on a smaller temporary image.

       This makes processing much faster,
       especially on phones.
    */

    const MAX_SIZE = 900;

    let scale = Math.min(
        1,
        MAX_SIZE / Math.max(
            sourceImage.width,
            sourceImage.height
        )
    );

    const w = Math.round(sourceImage.width * scale);
    const h = Math.round(sourceImage.height * scale);

    const temp = document.createElement("canvas");

    temp.width = w;
    temp.height = h;

    const ctx = temp.getContext("2d");

    ctx.drawImage(
        sourceImage,
        0,
        0,
        w,
        h
    );

    const imageData = ctx.getImageData(
        0,
        0,
        w,
        h
    );

    const pixels = imageData.data;

    /*
       Create binary mask.

       Dark/colored pixels are treated as
       possible bead pixels.

       White paper is ignored.
    */

    const mask = new Uint8Array(w * h);

    for (let y = 0; y < h; y++) {

        for (let x = 0; x < w; x++) {

            const i = (y * w + x) * 4;

            const r = pixels[i];
            const g = pixels[i + 1];
            const b = pixels[i + 2];

            const brightness =
                (r + g + b) / 3;

            const maxRGB =
                Math.max(r, g, b);

            const minRGB =
                Math.min(r, g, b);

            const saturation =
                maxRGB - minRGB;

            /*
               Conditions:

               1. Dark pixels
               2. Clearly colored pixels

               This helps detect brown Rudraksha
               even when it isn't extremely dark.
            */

            const dark =
                brightness < 205;

            const colored =
                saturation > 25 &&
                brightness < 235;

            if (dark || colored) {
                mask[y * w + x] = 1;
            }
        }
    }


    /* --------------------------------------------------
       MORPHOLOGICAL CLEANUP
    -------------------------------------------------- */

    // Remove isolated noise
    for (let pass = 0; pass < 2; pass++) {

        const copy = new Uint8Array(mask);

        for (let y = 1; y < h - 1; y++) {

            for (let x = 1; x < w - 1; x++) {

                const index = y * w + x;

                let neighbours = 0;

                for (let dy = -1; dy <= 1; dy++) {

                    for (let dx = -1; dx <= 1; dx++) {

                        if (dx === 0 && dy === 0)
                            continue;

                        neighbours +=
                            copy[
                                (y + dy) * w +
                                (x + dx)
                            ];
                    }
                }

                if (copy[index] === 1 &&
                    neighbours < 2) {

                    mask[index] = 0;
                }
            }
        }
    }


    /* --------------------------------------------------
       CONNECTED COMPONENTS
    -------------------------------------------------- */

    const visited = new Uint8Array(w * h);

    let bestComponent = null;
    let bestArea = 0;

    for (let y = 0; y < h; y++) {

        for (let x = 0; x < w; x++) {

            const start = y * w + x;

            if (
                mask[start] === 0 ||
                visited[start]
            ) {
                continue;
            }

            const queue = [start];

            visited[start] = 1;

            let area = 0;

            let minX = x;
            let maxX = x;
            let minY = y;
            let maxY = y;

            let sumX = 0;
            let sumY = 0;

            while (queue.length) {

                const current = queue.pop();

                const cy =
                    Math.floor(current / w);

                const cx =
                    current - cy * w;

                area++;

                sumX += cx;
                sumY += cy;

                minX = Math.min(minX, cx);
                maxX = Math.max(maxX, cx);

                minY = Math.min(minY, cy);
                maxY = Math.max(maxY, cy);

                /*
                   8-direction connection
                */

                for (let dy = -1; dy <= 1; dy++) {

                    for (let dx = -1; dx <= 1; dx++) {

                        if (
                            dx === 0 &&
                            dy === 0
                        ) continue;

                        const nx = cx + dx;
                        const ny = cy + dy;

                        if (
                            nx < 0 ||
                            nx >= w ||
                            ny < 0 ||
                            ny >= h
                        ) continue;

                        const ni =
                            ny * w + nx;

                        if (
                            mask[ni] &&
                            !visited[ni]
                        ) {

                            visited[ni] = 1;

                            queue.push(ni);
                        }
                    }
                }
            }

            /*
               Ignore tiny objects/noise.
            */

            if (area < 100)
                continue;

            /*
               Prefer large components that
               aren't touching the image edge.
            */

            const touchesEdge =
                minX <= 2 ||
                minY <= 2 ||
                maxX >= w - 3 ||
                maxY >= h - 3;

            let score = area;

            if (touchesEdge) {
                score *= 0.25;
            }

            if (score > bestArea) {

                bestArea = score;

                bestComponent = {
                    area,
                    minX,
                    maxX,
                    minY,
                    maxY,
                    centerX: sumX / area,
                    centerY: sumY / area
                };
            }
        }
    }


    /* --------------------------------------------------
       IF NOTHING FOUND
    -------------------------------------------------- */

    if (!bestComponent) {

        statusText.textContent =
            "Could not detect the bead.";

        alert(
            "Bead could not be detected.\n\n" +
            "Try a photo with a brighter white background " +
            "and the bead clearly separated from the paper."
        );

        return;
    }


    /* --------------------------------------------------
       BOUNDING BOX
    -------------------------------------------------- */

    let minX = bestComponent.minX;
    let maxX = bestComponent.maxX;

    let minY = bestComponent.minY;
    let maxY = bestComponent.maxY;

    let objectWidth =
        maxX - minX;

    let objectHeight =
        maxY - minY;

    /*
       Add 20% padding.
    */

    let padding =
        Math.max(
            objectWidth,
            objectHeight
        ) * 0.20;

    minX = Math.max(
        0,
        minX - padding
    );

    minY = Math.max(
        0,
        minY - padding
    );

    maxX = Math.min(
        w,
        maxX + padding
    );

    maxY = Math.min(
        h,
        maxY + padding
    );

    objectWidth =
        maxX - minX;

    objectHeight =
        maxY - minY;


    /* --------------------------------------------------
       CREATE SQUARE OUTPUT
    -------------------------------------------------- */

    outCtx.clearRect(
        0,
        0,
        1000,
        1000
    );

    // Pure white background
    outCtx.fillStyle = "#FFFFFF";

    outCtx.fillRect(
        0,
        0,
        1000,
        1000
    );


    /*
       Make bead occupy approximately
       75% of the canvas.
    */

    const targetSize = 750;

    const scaleFactor =
        targetSize /
        Math.max(
            objectWidth,
            objectHeight
        );

    const finalWidth =
        objectWidth * scaleFactor;

    const finalHeight =
        objectHeight * scaleFactor;

    /*
       Center exactly.
    */

    const finalX =
        (1000 - finalWidth) / 2;

    const finalY =
        (1000 - finalHeight) / 2;


    /*
       Draw cropped image.
    */

    outCtx.imageSmoothingEnabled = true;

    outCtx.imageSmoothingQuality = "high";

    outCtx.drawImage(
        temp,

        minX,
        minY,
        objectWidth,
        objectHeight,

        finalX,
        finalY,
        finalWidth,
        finalHeight
    );


    statusText.textContent =
        "Done — 1:1 image created.";

}


/* --------------------------------------------------
   DOWNLOAD
-------------------------------------------------- */

downloadButton.addEventListener(
    "click",
    function () {

        const link =
            document.createElement("a");

        link.download =
            "rudraksha-1x1.jpg";

        link.href =
            output.toDataURL(
                "image/jpeg",
                0.95
            );

        link.click();
    }
);

</script>

</body>
</html>
